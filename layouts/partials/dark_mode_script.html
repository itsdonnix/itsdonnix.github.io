<script>
  (function () {
    const toggleDarkEl = document.getElementById("toggle-dark");
    const htmlEl = document.querySelector("html");
    const hljsTheme = document.querySelector("#hljs-theme");

    if (!toggleDarkEl || !htmlEl || !hljsTheme) return;

    function getHLJSThemeURL(themeName) {
      const baseUrl = new URL(hljsTheme.href);
      baseUrl.pathname = baseUrl.pathname.replace(/[^/]+\.css$/, `${themeName}.min.css`);
      return baseUrl.href;
    }

    function setDark(dark, save = true) {
      htmlEl.classList.toggle("dark", dark);
      hljsTheme.href = getHLJSThemeURL(dark ? "atom-one-dark" : "atom-one-light");
      if (save) localStorage.setItem("dark", dark);
      toggleDarkEl.setAttribute("aria-checked", dark);
    }

    if (localStorage["dark"] === "true") {
      setDark(true);
    } else if (localStorage["dark"] === "false") {
      setDark(false);
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      setDark(true, false);
    }

    toggleDarkEl &&
      toggleDarkEl.addEventListener("click", function () {
        const isDark = htmlEl.classList.contains("dark");
        setDark(!isDark);
      });
  })();
</script>
